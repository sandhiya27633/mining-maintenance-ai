[pytest]
# pytest.ini — Test runner configuration
# Duty-Cycle-Based Predictive Maintenance System for Heavy Mining Vehicles

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Always show short tracebacks and verbose output by default
addopts = --tb=short -v --strict-markers

# Custom markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    db: marks tests that require a live database
    edge: marks edge-case tests (FR-16)

# Warnings filter
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
