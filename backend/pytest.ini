[pytest]
testpaths = app/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --tb=short -v --strict-markers
markers =
    slow: slow tests
    db: tests requiring live database
    isolation: multi-user isolation tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
